<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>방치형 히어로 (프로토타입)</title>
<style>
  html, body { margin: 0; height: 100%; background: #14161c; color: #fff;
    font-family: -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
  #wrap { max-width: 800px; margin: 0 auto; padding: 12px; }
  canvas { width: 100%; height: auto; display: block; border-radius: 10px; background: #1f2430; }
  #hud { margin-bottom: 8px; font-size: 18px; }
  #gold { color: #ffd54a; font-weight: 700; }

  .panel { display: none; margin-top: 10px; background: #1b2030; border-radius: 10px; padding: 10px; }
  .panel.open { display: block; }

  /* 장비 패널 */
  #slots { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x proximity; padding-bottom: 6px; }
  .slot { flex: 0 0 calc((100% - 20px) / 3.3); min-width: 112px; aspect-ratio: 1 / 1; box-sizing: border-box;
    background: #2a3144; border: 2px solid #3a4360; border-radius: 10px; padding: 8px;
    display: flex; flex-direction: column; justify-content: space-between; position: relative; scroll-snap-align: start; }
  .slot.equipped { border-color: #ffd54a; }
  .slot .top { display: flex; gap: 6px; align-items: flex-start; }
  .slot .icon { flex: none; width: 40px; height: 40px; }
  .slot .name { font-size: 13px; font-weight: 700; line-height: 1.2; }
  .slot .mult { font-size: 12px; color: #9fb0d8; margin-top: 3px; }
  .slot button { width: 100%; padding: 7px 0; border: 0; border-radius: 6px; font-size: 14px; font-weight: 700;
    cursor: pointer; background: #4da3ff; color: #fff; }
  .slot button.unequip { background: #d9534f; }
  .slot.locked { opacity: 0.55; }
  .slot.locked .lock { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 38px; }

  /* 업그레이드 패널 */
  #ups { display: flex; flex-direction: column; gap: 8px; max-height: 260px; overflow-y: auto; }
  .up { display: flex; align-items: center; gap: 12px; background: #2a3144; border: 2px solid #3a4360;
    border-radius: 10px; padding: 10px 12px; }
  .up .uicon { flex: none; width: 46px; height: 46px; }
  .up .info { flex: 1; min-width: 0; }
  .up .uname { font-size: 16px; font-weight: 700; }
  .up .ueff { font-size: 13px; color: #9fe0a8; margin-top: 4px; }
  .up .buy { flex: none; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .up .buy button { padding: 8px 20px; border: 0; border-radius: 6px; font-size: 14px; font-weight: 700;
    cursor: pointer; background: #3fbf5f; color: #fff; }
  .up .buy button:disabled { background: #4a5166; color: #98a0b5; cursor: not-allowed; }
  .up .price { font-size: 13px; color: #ffd54a; font-weight: 700; }

  /* 하단 탭 */
  #tabs { display: flex; justify-content: center; gap: 10px; margin-top: 10px; }
  .tab { background: #2a3144; border: 2px solid #3a4360; border-radius: 10px; color: #fff; cursor: pointer;
    padding: 6px 22px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .tab.active { border-color: #ffd54a; }
  .tab .ti { font-size: 26px; line-height: 26px; height: 26px; display: flex; align-items: center; }
  .tab .tt { font-size: 13px; }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">💰 골드: <span id="gold">0</span></div>
  <canvas id="game" width="800" height="400"></canvas>

  <div id="panelEquip" class="panel"><div id="slots"></div></div>
  <div id="panelUp" class="panel"><div id="ups"></div></div>

  <div id="tabs">
    <button class="tab" id="tabEquip"><span class="ti">🎒</span><span class="tt">장비</span></button>
    <button class="tab" id="tabUp">
      <span class="ti">
        <svg width="26" height="26" viewBox="0 0 26 26">
          <path d="M13 3 L23 14 H17 V23 H9 V14 H3 Z" fill="#3fbf5f"/>
        </svg>
      </span>
      <span class="tt">업그레이드</span>
    </button>
  </div>
</div>

<script>
// ===== 설정 (여기 숫자만 바꾸면 밸런스 조절 가능) =====
const CONFIG = {
  hero:    { attackInterval: 0.3, damage: 1 },   // damage = 기본 데미지
  monster: { name: '범죄자', maxHp: 10, rewardGold: 20, flySpeed: 700 },
  heroX: 220, monsterStopX: 320, spawnX: 900, groundY: 300,
  swingTime: 0.22,
};

// ===== 무기 목록 (새 무기는 여기에 추가) =====
const WEAPONS = [
  { id: 'stick', name: '나무 막대기', mult: 1, unlocked: true, color: '#a0693a', len: 60, thick: 6 },
  { id: 'w2', unlocked: false },
  { id: 'w3', unlocked: false },
  { id: 'w4', unlocked: false },
  { id: 'w5', unlocked: false },
  { id: 'w6', unlocked: false },
];

// ===== 업그레이드 목록 (새 업그레이드는 여기에 추가) =====
const UPGRADES = [
  {
    id: 'attack', name: '공격력',
    basePrice: 50,        // 첫 가격
    priceGrowth: 1.2,     // 구매할 때마다 가격 x1.2
    perLevel: 1,          // 구매할 때마다 공격력 +1배
  },
];

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const goldEl = document.getElementById('gold');

// ===== 상태 =====
const state = {
  gold: 0,
  attackTimer: 0,
  swing: 1,
  monster: null,
  floaters: [],
  equipped: 'stick',
  upLevel: { attack: 0 },   // 업그레이드 레벨
};

// ===== 계산 =====
function getWeapon() { return WEAPONS.find(w => w.id === state.equipped) || null; }
function upMult(u) { return 1 + u.perLevel * state.upLevel[u.id]; }       // 현재 배수 (1.0 -> 2.0 -> ...)
function upPrice(u) { return Math.round(u.basePrice * Math.pow(u.priceGrowth, state.upLevel[u.id])); }
function getDamage() {
  const w = getWeapon();
  const atkUp = UPGRADES.find(u => u.id === 'attack');
  return CONFIG.hero.damage * (w ? w.mult : 1) * upMult(atkUp);
}
const fmt = n => (Number.isInteger(n) ? String(n) : n.toFixed(1));

function setGold(v) {
  state.gold = v;
  goldEl.textContent = state.gold;
  refreshUpButtons();
}

function spawnMonster() {
  state.monster = { x: CONFIG.spawnX, hp: CONFIG.monster.maxHp, maxHp: CONFIG.monster.maxHp,
                    arrived: false, hitFlash: 0 };
}
function addFloater(text, x, y, color) { state.floaters.push({ text, x, y, color, life: 0.8 }); }

// ===== 업데이트 =====
function update(dt) {
  const m = state.monster;

  if (!m.arrived) {
    m.x -= CONFIG.monster.flySpeed * dt;
    if (m.x <= CONFIG.monsterStopX) {
      m.x = CONFIG.monsterStopX;
      m.arrived = true;
      state.attackTimer = 0;
    }
  } else {
    state.attackTimer += dt;
    while (state.attackTimer >= CONFIG.hero.attackInterval && m.hp > 0) {
      state.attackTimer -= CONFIG.hero.attackInterval;
      const dmg = getDamage();
      m.hp -= dmg;
      m.hitFlash = 0.1;
      state.swing = 0;
      addFloater('-' + fmt(dmg), m.x, CONFIG.groundY - 120, '#ff6b6b');
    }
    if (m.hp <= 0) {
      setGold(state.gold + CONFIG.monster.rewardGold);
      addFloater('+' + CONFIG.monster.rewardGold + 'G', m.x, CONFIG.groundY - 140, '#ffd54a');
      spawnMonster();
    }
  }

  state.monster.hitFlash = Math.max(0, state.monster.hitFlash - dt);
  state.swing = Math.min(1, state.swing + dt / CONFIG.swingTime);
  for (const f of state.floaters) { f.life -= dt; f.y -= 40 * dt; }
  state.floaters = state.floaters.filter(f => f.life > 0);
}

// ===== 그리기 =====
function drawPerson(x, y, bodyColor, opts = {}) {
  const { flash = false, criminal = false, flying = false } = opts;
  ctx.save();
  ctx.translate(x, y);
  if (flying) ctx.translate(0, Math.sin(performance.now() / 80) * 6);
  const c = flash ? '#ffffff' : bodyColor;
  ctx.fillStyle = c; ctx.fillRect(-18, -70, 36, 50);
  ctx.fillRect(-16, -20, 12, 20); ctx.fillRect(4, -20, 12, 20);
  ctx.fillStyle = flash ? '#fff' : '#f2c9a0';
  ctx.beginPath(); ctx.arc(0, -88, 16, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#222';
  ctx.fillRect(-8, -92, 4, 4); ctx.fillRect(4, -92, 4, 4);
  if (criminal) {
    ctx.fillStyle = flash ? '#fff' : '#111';
    ctx.fillRect(-16, -97, 32, 12);
    ctx.fillStyle = '#f2c9a0'; ctx.fillRect(-9, -93, 5, 5); ctx.fillRect(4, -93, 5, 5);
    ctx.fillStyle = '#222'; ctx.fillRect(-8, -92, 3, 3); ctx.fillRect(5, -92, 3, 3);
    ctx.fillStyle = flash ? '#fff' : '#777';
    for (let i = 0; i < 3; i++) ctx.fillRect(-18, -62 + i * 14, 36, 5);
  }
  ctx.restore();
}

function drawHeroArm(x, y) {
  const REST = -105, HIT = 65;
  const t = state.swing;
  const k = t < 0.4 ? 1 - Math.pow(1 - t / 0.4, 2) : 1 - (t - 0.4) / 0.6;
  const angle = (REST + (HIT - REST) * k) * Math.PI / 180;

  ctx.save();
  ctx.translate(x + 14, y - 62);
  ctx.rotate(angle);
  ctx.strokeStyle = '#f2c9a0'; ctx.lineWidth = 8; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(22, 0); ctx.stroke();
  const w = getWeapon();
  if (w) {
    ctx.fillStyle = w.color;
    ctx.fillRect(16, -w.thick / 2, w.len, w.thick);
  }
  ctx.fillStyle = '#f2c9a0';
  ctx.beginPath(); ctx.arc(22, 0, 6, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function draw() {
  ctx.clearRect(0, 0, 800, 400);
  ctx.fillStyle = '#2b3242'; ctx.fillRect(0, CONFIG.groundY, 800, 100);
  ctx.fillStyle = '#394058'; ctx.fillRect(0, CONFIG.groundY, 800, 4);

  const m = state.monster;
  const baseY = CONFIG.groundY + 40;

  drawPerson(CONFIG.heroX, baseY, '#4da3ff');
  drawHeroArm(CONFIG.heroX, baseY);

  drawPerson(m.x, baseY, '#d9534f', { flash: m.hitFlash > 0, criminal: true, flying: !m.arrived });
  if (m.arrived) {
    const w = 80, x = m.x - w / 2, y = CONFIG.groundY - 90;
    ctx.fillStyle = '#000'; ctx.fillRect(x - 1, y - 1, w + 2, 10);
    ctx.fillStyle = '#e44'; ctx.fillRect(x, y, w * Math.max(0, m.hp) / m.maxHp, 8);
    ctx.fillStyle = '#fff'; ctx.font = '13px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(`${CONFIG.monster.name}  ${fmt(Math.max(0, m.hp))}/${m.maxHp}`, m.x, y - 6);
  }

  ctx.font = 'bold 22px sans-serif'; ctx.textAlign = 'center';
  for (const f of state.floaters) {
    ctx.globalAlpha = Math.min(1, f.life / 0.4);
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
}

// ===== 장비 UI =====
const slotsEl = document.getElementById('slots');

function weaponIcon(w) {
  const sw = Math.max(4, w.thick);
  return `<svg class="icon" viewBox="0 0 40 40">
    <line x1="8" y1="32" x2="32" y2="8" stroke="${w.color}" stroke-width="${sw}" stroke-linecap="round"/>
  </svg>`;
}

function renderSlots() {
  slotsEl.innerHTML = WEAPONS.map(w => {
    if (!w.unlocked) {
      return `<div class="slot locked">
        <div class="top"><div class="icon"></div>
          <div><div class="name">???</div><div class="mult">공격력 ?배</div></div></div>
        <div></div>
        <div class="lock">🔒</div>
      </div>`;
    }
    const isEq = state.equipped === w.id;
    return `<div class="slot ${isEq ? 'equipped' : ''}">
      <div class="top">${weaponIcon(w)}
        <div><div class="name">${w.name}</div><div class="mult">공격력 ${w.mult}배</div></div></div>
      <button class="${isEq ? 'unequip' : ''}" data-id="${w.id}" data-act="${isEq ? 'off' : 'on'}">
        ${isEq ? '해제' : '장착'}</button>
    </div>`;
  }).join('');
}

slotsEl.addEventListener('click', e => {
  const btn = e.target.closest('button[data-id]');
  if (!btn) return;
  state.equipped = btn.dataset.act === 'on' ? btn.dataset.id : null;
  renderSlots();
});

// ===== 업그레이드 UI =====
const upsEl = document.getElementById('ups');

const SWORD_ICON = `<svg class="uicon" viewBox="0 0 46 46">
  <path d="M36 6 L40 6 L40 10 L20 30 L16 26 Z" fill="#d7dde8"/>
  <rect x="9" y="25" width="16" height="5" rx="1" transform="rotate(45 17 27)" fill="#c9a23a"/>
  <rect x="9" y="28" width="6" height="14" rx="2" transform="rotate(45 12 35)" fill="#8a5a2b"/>
</svg>`;

function renderUpgrades() {
  upsEl.innerHTML = UPGRADES.map(u => {
    const cur = upMult(u);
    const next = cur + u.perLevel;
    return `<div class="up">
      ${SWORD_ICON}
      <div class="info">
        <div class="uname">${u.name}</div>
        <div class="ueff">${u.name} ${cur.toFixed(1)}배 -> ${next.toFixed(1)}배</div>
      </div>
      <div class="buy">
        <button data-up="${u.id}">구매</button>
        <div class="price">💰 ${upPrice(u)}</div>
      </div>
    </div>`;
  }).join('');
  refreshUpButtons();
}

function refreshUpButtons() {
  upsEl.querySelectorAll('button[data-up]').forEach(btn => {
    const u = UPGRADES.find(x => x.id === btn.dataset.up);
    btn.disabled = state.gold < upPrice(u);
  });
}

upsEl.addEventListener('click', e => {
  const btn = e.target.closest('button[data-up]');
  if (!btn || btn.disabled) return;
  const u = UPGRADES.find(x => x.id === btn.dataset.up);
  const price = upPrice(u);
  if (state.gold < price) return;
  state.upLevel[u.id] += 1;
  setGold(state.gold - price);
  renderUpgrades();
});

// ===== 탭 =====
const tabs = [
  { btn: document.getElementById('tabEquip'), panel: document.getElementById('panelEquip') },
  { btn: document.getElementById('tabUp'),    panel: document.getElementById('panelUp') },
];
tabs.forEach(t => t.btn.addEventListener('click', () => {
  const willOpen = !t.panel.classList.contains('open');
  tabs.forEach(o => { o.panel.classList.remove('open'); o.btn.classList.remove('active'); });
  if (willOpen) { t.panel.classList.add('open'); t.btn.classList.add('active'); }
}));

// ===== 메인 루프 =====
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
renderSlots();
renderUpgrades();
spawnMonster();
requestAnimationFrame(loop);
</script>
</body>
</html>
